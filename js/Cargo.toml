[package]
name = "taktus-wasm"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "The WebAssembly build of taktus, wrapped for JavaScript by index.js."
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
taktus = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
